replicaCount: 2

image:
  repository: "rohitpathare1204/todo-frontend"
  tag: "dev"

service:
  type: ClusterIP
  port: 80
  targetPort: 80

containerPort: 80

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70
  memoryUtilization: 80

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""

ingress:
  enabled: true
  className: alb
  host: ""
  path: /
  
config:
  backendUrl: ""

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
